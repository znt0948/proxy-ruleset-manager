name: Ruleset Update (lite)

# lite 分支：只生成 hz 模板用到的 sing-box 规则集（直连、拦截、下载）。
# GitHub 只在默认分支上跑定时任务，每日更新由 main 分支的
# lite-schedule.yml 触发本工作流。
on:
  push:
    branches: [ lite ]
  workflow_dispatch:

# A newer push supersedes a running build (both would push to lite).
concurrency:
  group: lite-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: "Setup sing-box"
      env:
        SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.11.0-beta.13/sing-box_1.11.0-beta.13_linux_amd64.deb"
      run: |
          set -Eeuo pipefail
          wget -O sing-box.deb $SING_BOX_DEB_URL
          sudo dpkg -i sing-box.deb
    - name: Set up Go (for the sing-box matcher)
      uses: actions/setup-go@v5
      with:
        go-version-file: tools/srmatch/go.mod
        cache-dependency-path: tools/srmatch/go.sum
    - name: Build srmatch (sing-box rule engine, the version clients run)
      run: cd tools/srmatch && go build -o srmatch .
    - name: Set up Python3
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Prepare log file
      run: |
        # 创建log.txt并设置读写权限
        touch ./log.txt
        chmod 666 ./log.txt

    - name: Test ruleset semantics
      env:
        PYTHONPATH: src
      run: python -m unittest discover -s tests -v

    - name: Run script
      run: python main.py
    - name: Differential test with sing-box
      # The published sets under sing-box's own matcher: model fidelity,
      # compiled .srs = JSON, exclusivity, order independence, and every
      # destination change listed in report/exclusive.json. A failure keeps
      # the new rules from being published.
      env:
        PYTHONPATH: src
        SRMATCH_REQUIRED: "1"
      run: python -m unittest tests.test_singbox_differential -v
    - name: Commit and push rules
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        # 添加log.txt和规则文件
        git add ./rule/
        git add ./log.txt
        git add ./report/
    
        # 检查是否有文件被修改
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Update rules"
          git push
        fi
